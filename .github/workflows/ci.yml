name: CI

# The repository's one production incident was a build that broke in *deploy*
# rather than in review: build.sh fetched an unpinned sbt, sbt 2.x shipped
# requiring JDK 17, and the Vercel image provided JDK 11. Nothing in the repo
# had changed. Running the same compile and link here, on every push and every
# pull request, is what turns that class of failure into a red check instead of
# a dead site.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and link
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      # setup-java no longer ships sbt. The launcher reads the version from
      # project/build.properties, which stays the single source of truth that
      # build.sh already derives from.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Test
        run: sbt test

      # The production build. Linking is where a Scala.js project actually
      # fails, so a green compile alone would not prove the deploy works.
      - name: Link production bundle
        run: sbt fullLinkJS
